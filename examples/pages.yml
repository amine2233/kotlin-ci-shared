# Copy into the consumer repo at: .github/workflows/pages.yml
# Requires a mise.toml with a `build_documentations` task (see templates/mise.toml),
# the Dokka Gradle plugin, and: Settings → Pages → Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: amine2233/kotlin-ci-shared/.github/workflows/pages.yml@1.0.1
